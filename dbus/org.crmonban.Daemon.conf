<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the crmonban service and call its methods -->
  <policy user="root">
    <allow own="org.crmonban.Daemon"/>
    <allow send_destination="org.crmonban.Daemon"/>
    <allow receive_sender="org.crmonban.Daemon"/>
  </policy>

  <!-- Members of the crmonban group may control the daemon (ban/unban/etc.).
       Install this group and add trusted operators to it; do NOT widen this to
       the default context. (Security audit A3.) -->
  <policy group="crmonban">
    <allow send_destination="org.crmonban.Daemon"/>
    <allow receive_sender="org.crmonban.Daemon"/>
  </policy>

  <!-- Default deny: any other local user cannot invoke the mutating control
       methods (Ban/Unban/Whitelist/...). Previously this context allowed all
       sends, letting any unprivileged user ban/unban arbitrary IPs. -->
  <policy context="default">
    <deny send_destination="org.crmonban.Daemon"/>
  </policy>
</busconfig>
